apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: rootpassword
  MYSQL_DATABASE: medicaldb
  ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=medicaldb;User=root;Password=rootpassword;"
  Jwt__Key: "change-this-secret-key-to-something-long-and-random-123456"
  Jwt__Issuer: "MedicalApi"
  Jwt__Audience: "MedicalApp"