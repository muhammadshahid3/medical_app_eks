apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 552496640917.dkr.ecr.ap-south-1.amazonaws.com/medical-backend
          # asli ECR URL kustomization.yaml ke images section se aata hai
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            # Terraform ka banaya secret (RDS endpoint + user + password)
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: rds-conn
                  key: connection-string
          envFrom:
            - secretRef:
                name: backend-secret
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
