apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: medical

resources:
  - namespace.yaml
  - secret.yaml
  - mysql_deployment.yaml
  - mysql_service.yaml
  - backend_deployment.yaml
  - backend_service.yaml
  - frotend_deployment.yaml
  - frontend_serivce.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: medibook

images:
  - name: shahiddevops1/medicalapp-backend
    newTag: latest
  - name: shahiddevops1/medicalapp-frontend
    newTag: latest