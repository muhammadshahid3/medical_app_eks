# ingress-nginx (Terraform ne install kiya) ke zariye bahar se traffic aata hai:
#   NLB -> ingress-nginx -> /api -> backend,  / -> frontend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medical-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
