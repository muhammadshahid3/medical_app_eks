name: Build and Push Images

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"        # bot ka commit dobara pipeline na chalaye
  workflow_dispatch:

permissions:
  contents: write       # kustomization.yaml commit karne ke liye

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/medicalapp-frontend:${{ github.sha }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/medicalapp-backend:${{ github.sha }}

      - name: Update image tag in k8s/kustomization.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          sed -i "s/newTag: .*/newTag: ${GITHUB_SHA}/" k8s/kustomization.yaml
          git add k8s/kustomization.yaml
          git commit -m "ci: deploy ${GITHUB_SHA::7} [skip ci]" || exit 0
          git push origin main